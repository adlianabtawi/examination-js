<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <!-- Lucide Icons: bibliotek som gör om <i data-lucide="..."> till SVG-ikoner -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
            <!-- ============================================================
             HEADER: innehåller hamburgermeny, navigation, logga och varukorg
             ============================================================ -->
    <header>
        <div class="container">

            <div class="header-content">

                <!-- Hamburgermeny-knapp (syns bara på mobil via CSS) -->
                <button id="menu-toggle" class="menu-toggle">
                    
                    <!-- Lucide ikon: "menu" -->
                    <i data-lucide="menu"></i>
                </button>


                <!-- Navigationsmeny som öppnas/stängs på mobil -->
                <nav id="nav-menu" class="nav-menu">
                    <button class="nav-link">Butik</button>
                    <button class="nav-link">Om Oss</button>
                    <button class="nav-link">Kontakt</button>
                </nav>


                <!-- Logo: klick leder till startsidan -->
                <a href="index.html" class="logo-link">
                    <img 
                        src="logo.png" 
                        alt="Möbler Logotyp"
                        class="logo-img"
                    />
                </a>


                <!-- Varukorgsknapp: öppnar modal med varukorg -->
                <button id="cart-btn" class="cart-icon">
                    <i data-lucide="shopping-cart"></i>

                    <!-- Badge visar antal varor i varukorgen -->
                    <span id="cart-badge" class="cart-badge">0</span>
                </button>
            </div>

        </div>
    </header>



             <!-- ============================================================
             MAIN: hero + product grid som fylls med produkter via JS
             ============================================================ -->
    <main class="container">

        <!-- Hero-sektion: rubrik och introtext -->
        <div class="hero">
            <h1>Vår Kollektion</h1>
            <p>Designmöbler för det moderna hemmet</p>
        </div>


        <!-- Här renderar JS produktkorten -->
        <div id="product-grid" class="product-grid"></div>
    </main>


            <!-- ============================================================
             FOOTER: info längst ner på sidan
             ============================================================ -->
    <footer>
        <div class="container">

            <p><strong>MÖBLER</strong></p>


            
            <p id="copy-right">
                &copy; 2025 Adli, Anmar & Bleart. Alla rättigheter
                förbehållna.
            </p>
        </div>
    </footer>


            <!-- ============================================================
             MODAL: används för produktdetaljer och varukorg
             hidden = inte synlig
             ============================================================ -->
    <div id="app-modal" class="modal hidden">
        
        <div class="modal-content">

            <!-- Stäng modal-knapp -->
            <button id="close-modal" class="modal-close">
                <i data-lucide="x"></i>
            </button>

            <!-- Här renderar JS innehåll (varukorg/detaljvy) -->
            <div id="modal-body"></div>
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
